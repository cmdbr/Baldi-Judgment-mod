<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Çıktı</title>
<style>
        body { margin: 0; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #app-container { position: relative; width: 1024px; height: 768px; background-color: rgb(128, 255, 255); overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .element { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; overflow: hidden; }
        .el-kutucuk { width: 180px; height: 100px; background-color: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px; padding: 10px; text-align: left; align-items: flex-start; justify-content: flex-start; }
        .el-textbox { width: 200px; height: 40px; padding: 4px; }
        .el-textbox textarea { width: 100%; height: 100%; resize: none; box-sizing: border-box; background: transparent; border: 1px solid #d1d5db; border-radius: 4px; padding: 5px; font-size: 12px; }
        .el-resim { width: 120px; height: 120px; background-color: #e5e7eb; border: 1px solid #d1d5db; border-radius: 4px; }
        .el-video { width: 300px; height: 180px; background-color: #000; border-radius: 4px; }
        .el-saat { width: 150px; height: 45px; background-color: #18181b; color: #38bdf8; font-family: monospace; font-size: 13px; font-weight: bold; border-radius: 4px; border: 1px solid #333; }
        .el-buton { padding: 8px 16px; background-color: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .el-hareketli2d { width: 60px; height: 60px; background-color: #ea580c; color: white; font-weight: bold; border-radius: 6px; display: flex; align-items: center; justify-content: center; z-index: 99; }
        .el-kodblogu { width: 260px; height: 150px; background-color: #0f172a; color: #38bdf8; font-family: monospace; font-size: 12px; border: 1px solid #33333d; border-radius: 6px; padding: 8px; text-align: left; align-items: flex-start; justify-content: flex-start; }
        .el-kodblogu textarea { width: 100%; height: 100%; resize: none; box-sizing: border-box; background: transparent; color: #38bdf8; border: none; font-family: monospace; font-size: 12px; outline: none; }
        .el-buton-0 { left: 7px; top: 352px; width: 1000px; }
        .el-resim-1 { left: 20px; top: 71px; width: 250px; height: 250px; background-image: url('https://r.resimlink.com/0e_RdG.png'); }
        .el-kutucuk-2 { left: 288px; top: 76px; width: 500px; height: 100px; }
        .el-video-3 { left: 11px; top: 458px; }
        .el-buton-4 { left: 7px; top: 400px; width: 1000px; }
    </style>
</head>
<body>
    <div id="app-container">
        <a href="https://www.mediafire.com/file/pg4le5y8sf4xz8h/Judgment_1.0.rar/file" class="element el-buton el-buton-0" target="_blank">İndir</a>
        <div class="element el-resim el-resim-1"></div>
        <div class="element el-kutucuk el-kutucuk-2">Baldi Judgment mod -- Tarafından İbrahim ex</div>
        <div class="element el-video el-video-3"><iframe src="https://www.youtube.com/embed/Tso9omjuNR4" style="width:100%; height:100%; border:none;" allowfullscreen></iframe></div>
        <a href="https://www.mediafire.com/file/4qjgylh2h5rbqre/Judgment_2.0.rar/file" class="element el-buton el-buton-4" target="_blank">2.0 İndir</a>
    </div>
    <script>
        let variables = {};

        function handleExportInput(textareaEl, bindVar) {
            let val = textareaEl.value;
            if (bindVar) {
                variables[bindVar] = val;
                document.querySelectorAll('[data-bind-var="' + bindVar + '"]').forEach(el => {
                    if (el.tagName === 'TEXTAREA') {
                        if (el !== textareaEl) el.value = val;
                    } else {
                        el.innerHTML = val;
                    }
                });
            }
        }
</script>
</body>
</html>
